<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KASIR SEMBAKO AGEN</title>
<style>
:root{
  --navy:#0b2545;
  --navy-2:#123a6b;
  --blue:#1d6fc9;
  --blue-dark:#14528f;
  --blue-light:#eaf3fc;
  --blue-lighter:#f4f9fe;
  --gray-50:#f7f8fa;
  --gray-100:#eef1f4;
  --gray-200:#e3e8ee;
  --gray-300:#d7dde3;
  --gray-500:#8592a3;
  --gray-600:#647184;
  --gray-700:#4a5568;
  --text:#182335;
  --white:#ffffff;
  --green:#1e8e5a;
  --green-bg:#e7f7ef;
  --green-bd:#bfe8d3;
  --red:#c8342c;
  --red-bg:#fdecea;
  --red-bd:#f4c2be;
  --orange:#c4780f;
  --orange-bg:#fef3e2;
  --orange-bd:#f5dba8;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-md:0 4px 12px rgba(16,24,40,.12);
  --sidebar-w:236px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--gray-50);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px;}

#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:var(--sidebar-w);
  background:var(--navy);
  color:#dce6f2;
  flex-shrink:0;
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  z-index:40;
  transition:transform .2s ease;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 18px 16px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-brand .logo-badge{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#fff;flex-shrink:0;
}
.sidebar-brand .brand-text{line-height:1.25;}
.sidebar-brand .brand-text b{display:block;font-size:14px;letter-spacing:.2px;color:#fff;}
.sidebar-brand .brand-text span{font-size:11px;color:#9fb3cc;}

.nav-list{list-style:none;margin:0;padding:10px 10px 20px 10px;}
.nav-list li{margin-bottom:2px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:8px;
  color:#c4d3e6;font-size:13.5px;font-weight:500;
  cursor:pointer;user-select:none;
  border:1px solid transparent;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{
  background:rgba(29,111,201,.22);
  color:#fff;
  border-color:rgba(29,111,201,.4);
}
.nav-item.active svg{opacity:1;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  color:#5f7793;padding:14px 12px 6px 12px;font-weight:600;
}

#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,20,35,.4);z-index:35;}

/* ---------- MAIN ---------- */
#main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:60px;background:#fff;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;position:sticky;top:0;z-index:20;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
#menu-toggle{
  display:none;background:none;border:none;padding:6px;border-radius:6px;
}
#menu-toggle svg{width:22px;height:22px;color:var(--navy);}
#page-title{font-size:16.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#page-subtitle{font-size:12px;color:var(--gray-600);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.topbar-clock{font-size:12.5px;color:var(--gray-600);text-align:right;line-height:1.3;}
.topbar-clock b{display:block;color:var(--navy);font-size:13px;}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;
  background:var(--gray-100);border-radius:20px;
}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.user-chip span{font-size:12.5px;font-weight:600;color:var(--navy);}

#content{flex:1;padding:20px 22px 60px 22px;max-width:1400px;width:100%;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}

/* ---------- CARDS / STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat-card .stat-icon{
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
}
.stat-card .stat-icon svg{width:18px;height:18px;}
.stat-card .stat-label{font-size:12px;color:var(--gray-600);font-weight:600;}
.stat-card .stat-value{font-size:20px;font-weight:700;color:var(--navy);margin-top:3px;}
.stat-card .stat-foot{font-size:11.5px;color:var(--gray-500);margin-top:4px;}
.stat-card.blue .stat-icon{background:var(--blue-light);color:var(--blue-dark);}
.stat-card.green .stat-icon{background:var(--green-bg);color:var(--green);}
.stat-card.red .stat-icon{background:var(--red-bg);color:var(--red);}
.stat-card.orange .stat-icon{background:var(--orange-bg);color:var(--orange);}
.stat-card.gray .stat-icon{background:var(--gray-100);color:var(--gray-700);}

.section-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:18px;
}
.section-card .sc-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;
}
.sc-head h3{margin:0;font-size:14.5px;font-weight:700;color:var(--navy);}
.sc-head .sc-sub{font-size:11.5px;color:var(--gray-500);margin-top:2px;font-weight:400;}
.sc-body{padding:14px 16px;}
.sc-body.no-pad{padding:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:8px;border:1px solid var(--gray-300);
  background:#fff;color:var(--text);font-size:13px;font-weight:600;
  white-space:nowrap;
}
.btn svg{width:15px;height:15px;}
.btn:hover{background:var(--gray-50);}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-success{background:var(--green);border-color:var(--green);color:#fff;}
.btn-success:hover{filter:brightness(.95);}
.btn-danger{background:#fff;border-color:var(--red-bd);color:var(--red);}
.btn-danger:hover{background:var(--red-bg);}
.btn-danger.solid{background:var(--red);border-color:var(--red);color:#fff;}
.btn-warn{background:#fff;border-color:var(--orange-bd);color:var(--orange);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn-icon{padding:7px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}

/* ---------- FORMS ---------- */
.form-group{margin-bottom:13px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--gray-700);margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--gray-300);border-radius:8px;
  background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-light);border-color:var(--blue);}
textarea{resize:vertical;min-height:60px;}
.input-with-icon{position:relative;}
.input-with-icon svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gray-500);}
.input-with-icon input{padding-left:34px;}
.hint{font-size:11px;color:var(--gray-500);margin-top:4px;}
fieldset{border:1px dashed var(--gray-300);border-radius:8px;padding:12px;margin:0 0 13px 0;}
fieldset legend{font-size:12px;font-weight:700;color:var(--gray-700);padding:0 6px;}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
thead th{
  text-align:left;padding:10px 14px;background:var(--gray-50);
  color:var(--gray-600);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;
  font-weight:700;border-bottom:1px solid var(--gray-200);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--blue-lighter);}
.text-right{text-align:right;}
.text-center{text-align:center;}
.muted{color:var(--gray-500);}
.mono{font-variant-numeric:tabular-nums;}

/* ---------- BADGE ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  border:1px solid transparent;white-space:nowrap;
}
.badge-green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd);}
.badge-red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd);}
.badge-orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange-bd);}
.badge-gray{background:var(--gray-100);color:var(--gray-700);border-color:var(--gray-300);}
.badge-blue{background:var(--blue-light);color:var(--blue-dark);border-color:#bcdcf7;}

.progress{height:6px;background:var(--gray-200);border-radius:4px;overflow:hidden;width:100%;}
.progress > div{height:100%;border-radius:4px;}

/* ---------- TOOLBAR ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.toolbar .spacer{flex:1;}
.search-box{position:relative;min-width:220px;flex:1;max-width:320px;}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gray-500);}
.search-box input{padding-left:32px;}
.chip-filter{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:6px 12px;border-radius:20px;border:1px solid var(--gray-300);
  background:#fff;font-size:12.5px;font-weight:600;color:var(--gray-700);
}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

/* ---------- EMPTY / LOADING ---------- */
.empty-state{padding:50px 20px;text-align:center;color:var(--gray-500);}
.empty-state svg{width:44px;height:44px;color:var(--gray-300);margin-bottom:10px;}
.empty-state p{margin:0;font-size:13.5px;}
.empty-state .empty-title{font-weight:700;color:var(--gray-700);margin-bottom:4px;font-size:14px;}
.loading-row{padding:40px;text-align:center;color:var(--gray-500);font-size:13px;}
.spinner{
  width:22px;height:22px;border:3px solid var(--gray-200);border-top-color:var(--blue);
  border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-bottom:8px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- KASIR LAYOUT ---------- */
.kasir-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
.kasir-left,.kasir-right{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);}
.kasir-left{padding:14px;}
.kasir-right{padding:0;display:flex;flex-direction:column;height:calc(100vh - 150px);position:sticky;top:76px;}
.kasir-toolbar{display:flex;gap:8px;margin-bottom:12px;}
.scan-btn{
  background:var(--navy);color:#fff;border:none;border-radius:8px;padding:0 16px;
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;flex-shrink:0;
}
.scan-btn svg{width:18px;height:18px;}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.product-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
  max-height:calc(100vh - 300px);overflow-y:auto;padding-right:4px;
}
.product-card{
  border:1px solid var(--gray-200);border-radius:9px;padding:10px;background:#fff;
  text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;
}
.product-card:hover{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}
.product-card .p-emoji{font-size:22px;line-height:1;margin-bottom:2px;}
.product-card .p-name{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.3;min-height:32px;}
.product-card .p-cat{font-size:10.5px;color:var(--gray-500);}
.product-card .p-price{font-size:13px;font-weight:700;color:var(--blue-dark);margin-top:2px;}
.product-card .p-stock{font-size:10.5px;margin-top:2px;}
.product-card.out-of-stock{opacity:.5;}
.product-card .p-badge{position:absolute;top:6px;right:6px;}

.cart-header{padding:14px 16px;border-bottom:1px solid var(--gray-100);}
.cart-header h3{margin:0;font-size:14.5px;color:var(--navy);}
.cart-customer{padding:10px 16px;border-bottom:1px solid var(--gray-100);}
.cart-items{flex:1;overflow-y:auto;padding:8px 16px;}
.cart-item{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--gray-100);}
.cart-item .ci-info{flex:1;min-width:0;}
.cart-item .ci-name{font-size:12.5px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cart-item .ci-price{font-size:11.5px;color:var(--gray-500);}
.qty-ctrl{display:flex;align-items:center;gap:6px;}
.qty-ctrl button{width:24px;height:24px;border-radius:6px;border:1px solid var(--gray-300);background:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
.qty-ctrl input{width:38px;text-align:center;padding:4px 2px;border-radius:6px;}
.cart-item .ci-subtotal{font-size:12.5px;font-weight:700;width:78px;text-align:right;}
.cart-item .ci-remove{color:var(--red);background:none;border:none;padding:4px;}
.cart-item .ci-remove svg{width:15px;height:15px;}
.cart-empty{padding:40px 10px;text-align:center;color:var(--gray-500);font-size:12.5px;}
.cart-summary{padding:14px 16px;border-top:1px solid var(--gray-100);background:var(--gray-50);border-radius:0 0 var(--radius) var(--radius);}
.sum-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;color:var(--gray-700);}
.sum-row.total{font-size:16px;font-weight:800;color:var(--navy);border-top:1px dashed var(--gray-300);padding-top:9px;margin-top:2px;}
.sum-row input{width:120px;text-align:right;padding:5px 8px;}
.pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(10,20,35,.5);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal-box{
  background:#fff;border-radius:12px;max-width:560px;width:100%;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md);
}
.modal-box.wide{max-width:820px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--gray-100);}
.modal-head h3{margin:0;font-size:15.5px;color:var(--navy);}
.modal-close{background:none;border:none;padding:4px;color:var(--gray-500);}
.modal-close svg{width:20px;height:20px;}
.modal-body{padding:18px;overflow-y:auto;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--gray-100);display:flex;justify-content:flex-end;gap:8px;}

/* ---------- TOAST ---------- */
#toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  min-width:240px;max-width:340px;background:#fff;border-radius:9px;box-shadow:var(--shadow-md);
  padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--blue);
  animation:toast-in .18s ease;
}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.toast.success{border-color:var(--green);}
.toast.error{border-color:var(--red);}
.toast.warn{border-color:var(--orange);}
.toast svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
.toast.success svg{color:var(--green);}
.toast.error svg{color:var(--red);}
.toast.warn svg{color:var(--orange);}
.toast.info svg{color:var(--blue);}
.toast .t-text{font-size:12.5px;font-weight:600;color:var(--text);}

/* ---------- BARCODE MODAL ---------- */
#barcode-video{width:100%;border-radius:10px;background:#000;max-height:320px;object-fit:cover;}
.scan-frame-msg{text-align:center;font-size:12.5px;color:var(--gray-600);margin-top:8px;}
.manual-barcode{display:flex;gap:8px;margin-top:12px;}

/* ---------- RECEIPT ---------- */
#receipt-print{display:none;}
.receipt-paper{width:280px;font-family:'Courier New',monospace;font-size:11.5px;color:#000;padding:6px;margin:0 auto;}
.receipt-paper hr{border:none;border-top:1px dashed #000;margin:6px 0;}
.receipt-paper .r-center{text-align:center;}
.receipt-paper .r-row{display:flex;justify-content:space-between;gap:6px;}
.receipt-paper table{width:100%;font-size:11px;}
.receipt-paper td{padding:1px 0;border:none;}

/* ---------- MISC ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-200);margin-bottom:14px;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--gray-600);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab-btn.active{color:var(--blue-dark);border-color:var(--blue);}
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.list-simple{list-style:none;margin:0;padding:0;}
.list-simple li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:12.5px;}
.list-simple li:last-child{border-bottom:none;}
.avatar-sq{width:32px;height:32px;border-radius:7px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.flex-center-gap{display:flex;align-items:center;gap:9px;}
.text-danger{color:var(--red);}
.text-success{color:var(--green);}
.text-warn{color:var(--orange);}
.font-bold{font-weight:700;}
.small{font-size:11.5px;}
.item-row-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.item-row-grid label{font-size:10.5px;margin-bottom:3px;}
.remove-row-btn{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);border-radius:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}

@media (max-width:980px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .kasir-layout{grid-template-columns:1fr;}
  .kasir-right{position:static;height:auto;max-height:none;}
  .grid-2,.grid-3,.two-col{grid-template-columns:1fr;}
  .form-row,.form-row.cols-3{grid-template-columns:1fr;}
}
@media (max-width:760px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.show{display:block;}
  #main{margin-left:0;}
  #menu-toggle{display:flex;align-items:center;justify-content:center;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  #page-title{font-size:14.5px;}
  .topbar-clock{display:none;}
  .item-row-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-badge">KS</div>
      <div class="brand-text">
